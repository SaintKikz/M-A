# Déploiement Netlify — M&A Training Lab
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# L'ordre compte : la première règle qui correspond gagne. L'endpoint de la
# fonction doit donc être déclaré AVANT le catch-all SPA, sinon il serait
# servi comme index.html.
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/anthropic"
  status = 200

# SPA : toutes les autres routes sont servies par index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
